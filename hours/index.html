<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='robots' content='noindex,nofollow'><title>Pavoot Hours</title><link rel='manifest' href='manifest.json'><meta name='theme-color' content='#0c0d18'><link rel='icon' href='icon-192.png'><link rel='apple-touch-icon' href='apple-touch-icon.png'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><meta name='apple-mobile-web-app-title' content='Pavoot Hours'><link rel='stylesheet' href='app.css?v=2'></head><body>
<div id='login' hidden><div class='card login'><div class='logo'>⏱ Pavoot <b>Hours</b></div><p class='mut'>Track your hours, see each other's progress and hit the weekly goal together.</p><input id='kin' class='f' placeholder='Paste your key or sign-in link' autocomplete='off' autocapitalize='off'><button class='btn wide' data-act='login'>Sign in</button><p id='lerr' class='mut'></p></div></div>
<div id='app' hidden>
<header><div class='logo'>⏱ Pavoot <b>Hours</b></div><span class='sp'></span><span id='dot' class='dot' title='Sync status'></span><span id='me' class='me'></span><button class='ib' data-act='nav' data-v='set' aria-label='Settings'>⚙️</button></header>
<div class='top'><div id='tbar' class='tbar'><input id='tnote' placeholder='What are you working on?' enterkeyhint='go' autocomplete='off'><span id='tclock'>0:00:00</span><button id='tbtn' data-act='toggle' aria-label='Start timer'>▶</button></div><div id='chips' class='chips'></div></div>
<main id='main'></main>
<nav class='bn'><button data-act='nav' data-v='timer'><i>⏱</i>Timer</button><button data-act='nav' data-v='team'><i>🏆</i>Team</button><button data-act='nav' data-v='stats'><i>📊</i>Stats</button><button data-act='nav' data-v='cal'><i>📅</i>Calendar</button><button data-act='nav' data-v='off'><i>🌴</i>Days off</button></nav>
</div>
<div id='modal' hidden></div><div id='toast'></div>
<script src='app.js?v=2'></script></body></html>
