<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Watched & consumed - Ana</title>
<style>
:root{--ink:#1e1b4b;--muted:#64748b;--bg:#f8fafc;--card:#fff;--accent:#4f46e5;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}

.pill{border:1px solid #c7d2fe;background:var(--soft);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}.pill.on{background:var(--accent);color:#fff}

.ch a{color:var(--ink);text-decoration:none}.ch a b{color:var(--accent);font-weight:600;margin-right:6px}
.thumb{width:100%;border-radius:12px;display:block;margin-bottom:12px}

</style></head><body>

<script>
const ITEMS=[
{"id": "pg-making-startups-powerful", "type": "Article", "title": "Making Startups Powerful", "by": "Paul Graham", "url": "https://paulgraham.com/powerful.html", "length": "~14 min read", "published": "2026-09", "consumed": "2026-11-15", "tags": ["strategy", "power", "network effects", "marketplace", "agents", "ideas"], "mine": [], "learnings": ["<b>Ask what would make the company more powerful, not just richer.</b> \"More money\" yields incremental improvements; \"more powerful\" can make it orders of magnitude more valuable.", "<b>Own the customer and make the money flow through you.</b> Move from component supplier to the one with the customer relationship. Tokens flowing through you count too, but watch whether the model companies could engulf you or your customers.", "<b>Build an app store, or at least the standard.</b> Others building on you makes you more valuable. In a new field, the first standard proposed tends to win, no matter who proposed it.", "<b>Find network effects where you would not expect them.</b> Let users share something (opt-in benchmarks, opt-in model training). Generalize the idea: if agents can pay for things, can they pay each other? Then you are a marketplace.", "<b>Go full stack, or eat through the customer.</b> Use your tech to do x yourself instead of selling it to companies doing x, or do all their hardest work until the real customer is their customer.", "<b>Look for tails that wag the dog.</b> PayPal started as a demo of security software. When users \"misuse\" your product, listen: it could be the real product.", "<b>Help users make money.</b> They adopt fast and pay a lot, so revenue grows doubly fast. Most of YC's biggest winners do this.", "<b>Play the long game and be generous.</b> 10-year tradeoffs are underpriced. Create more value than you capture: open source, extensibility, and APIs, especially now that agents are replacing human users.", "<b>Sell to early-stage companies and to customers who decide fast.</b> Usage pricing grows at startup rates (Stripe, the Collison install). Fast deciders decide on quality; hospitals and school districts are mud. Ask \"at what point in their life\" instead of \"what size\" customer.", "<b>Get the data early; upstream is almost always good.</b> Rippling started with onboarding, where employee data is born.", "<b>Avoid mafia markets</b> (record labels, PBMs) or come in from the side and make them irrelevant instead of a frontal attack.", "<b>Often the startup holds itself back.</b> Much advice is \"you don't need x, just y\". Complicated ideas often come from fear; just stand up straight.", "<b>The one constraint: it must be better for the customer.</b> Run it backwards to generate ideas: what would the perfect world look like for the customer, and which part of it could you become?"], "quotes": ["Asking how the company could make more money is a good heuristic too, but it tends to yield incremental improvements.", "It's always good when money flows through you.", "So err on the side of having APIs. Especially when you're a larval startup and have nothing to lose.", "Upstream is almost always good, whether it's with money or user relationship or customer stage or data.", "Just y is often, in effect, just stand up straight."]},
{"id": "dalton-all-about-pivoting", "type": "Video", "title": "All About Pivoting", "by": "Dalton Caldwell (Y Combinator, Startup School)", "url": "https://www.youtube.com/watch?v=8pNxKX1SUGE", "yt": "8pNxKX1SUGE", "length": "27:55", "published": "2019-08-29", "consumed": "2026-11-15", "tags": ["pivot", "ideas", "founder-market fit", "venture scale", "YC"], "mine": [], "learnings": ["<b>A pivot just means changing your idea.</b> Early on (pre-launch or just after) it should feel lightweight. If you are not rapidly changing ideas and assumptions, you are probably moving too slow.", "<b>Why pivot: opportunity cost.</b> His pseudo-code: if (how well it is working / months of full-time effort) &lt; excitement for something else + confidence you can find better, pivot. Many months with nothing happening is the strongest signal.", "<b>Good reasons:</b> you hate working on it, it is not growing, you are not a good fit, or it depends on something outside your control (mainstream VR or crypto adoption).", "<b>Shots on goal.</b> Every new attempt is another shot; founders who take several create their own luck.", "<b>Finding a better idea:</b> pick what makes you more excited and optimistic; a perceived harder idea is often better (bored ad-tech team became \"Robinhood for India\" and lit up); play to honest strengths; pick something you can build and validate fast, not years of R&D.", "<b>Is it VC fundable?</b> Could it make hundreds of millions or billions a year, get there in 5-10 years, be public one day, with technology at its core built by the founders and 70-80% gross margins? Not raising VC is fine, just be self-aware.", "<b>Best time to pivot:</b> weeks or months after launch and it feels hopeless; it is impossible to get started (\"once we raise $100M we will build a prototype\"); or you know in your heart it will not work.", "<b>Avoid whiplash.</b> Pivoting over and over makes founders give up, which is deadlier than a mediocre idea you enjoy. Find the happy medium, and do not hire while you are still pivoting.", "<b>Idea quality score:</b> rate 1-10 and average: how big it seems, founder/market fit, how easy it is to get started (undersold), early market feedback.", "<b>Brex:</b> VR headset (2.5/10: no hardware skills, millions to prototype, nobody wanted it) to a credit card for startups (big 10, fit 10 after a Brazil fintech exit, start 3, feedback 8: a three-sentence sales process).", "<b>Retool:</b> Venmo for the UK (users but no one paid, losing money per transaction) to an internal tools builder (big 10, fit 10, built in 2 weeks, feedback 5). Beware insidious half-traction.", "<b>Magic and Segment:</b> Magic left a blood pressure coach, built Magic in a weekend and hit #1 on Hacker News. Segment took years to drop a classroom feedback tool; its open-source analytics library was what the market begged for."], "quotes": ["It just means changing your idea. That's all it means.", "If you're not in a state where you're rapidly changing ideas or assumptions over, and over, and over again in quick succession, you are likely doing it wrong.", "Weirdly, it's more deadly to your company to get whiplash and get sad than to work on a bad idea.", "I would argue finding an idea that's easy to get started with is just as important as the idea itself."], "chapters": [["0:00", "Introduction"], ["0:29", "What is a \"pivot\"?"], ["1:54", "Why pivot?"], ["3:09", "Good and bad reasons to pivot"], ["4:51", "People wait too long to pivot"], ["8:57", "Product/market fit"], ["10:09", "Finding a better idea"], ["14:27", "The best time to pivot"], ["16:41", "Scoring ideas"], ["18:41", "Real-world examples"], ["26:50", "Conclusion"]]},
{id:'postmortem-dead-startup',type:'Video',title:'Postmortem on a Dead Startup',by:'Dalton Caldwell & Michael Seibel (Dalton + Michael)',url:'https://www.youtube.com/watch?v=Vh_eVn92KTc',yt:'Vh_eVn92KTc',length:'17:09',published:'2026-11-09',consumed:'2026-11-15',tags:['founders','regret','pivot','co-founders','fundraising'],
mine:['Nobody regrets the journey of doing a startup. It is one of the hardest experiences of their life, but it is also huge growth.','What people do regret is not starting the next thing earlier, not trying harder, and not going all the way (fully testing the idea before calling it).'],
learnings:[
'<b>Your startup is a hypothesis.</b> Most hypotheses are wrong, and that is fine. The regret is never fully testing it, not that it turned out false.',
'<b>The cost of indecision.</b> The most common regret: putting off the hard decision (pivot, shut down, change direction) until the money is almost gone. Decide earlier.',
'<b>People and team issues.</b> Picking the wrong co-founder and leaving team problems unresolved are recurring regrets. Fix them when you see them.',
'<b>The myth of the Hail Mary.</b> Another fundraise or another launch usually will not save the company. Confront the hard truth instead of chasing a last-minute miracle.',
'<b>Protect your "health bar".</b> Energy is a resource. Burning out makes every later decision worse.',
'<b>Investor and moral pressure.</b> Guilt about investor money keeps struggling companies alive too long. Founders often misunderstand what they actually owe investors.',
'<b>Growth through failure.</b> They never hear "I regret doing a startup". People regret specific decisions, never the journey. You go from a normal human to a minor superhero, like after 2 years at the gym.',
'<b>A failed startup still pays off.</b> It makes you a stronger founder and a more valuable hire, and fundraising is often easier the second time.',
'<b>Apply it now.</b> Imagine you are shutting down one year from today. Write down what you would wish you had done differently, and make those changes today.'],
quotes:['Your startup is a hypothesis, right? And for any good scientist, how often is their hypothesis correct? It\'s like not that often.','What I never hear is I regret doing a startup.','There\'s regret about specific decisions, but there\'s never regret about the journey.'],
chapters:[['0:00','Introduction to postmortems'],['1:05','The cost of indecision'],['3:51','Lack of closure'],['5:08','People and team issues'],['7:17','The myth of Hail Marys'],['9:44','Investor and moral pressure'],['12:30','Growth through failure'],['15:36','Applying these lessons now']]}
];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const secs=t=>t.split(':').reduce((a,b)=>a*60+ +b,0);
let tag='';
function card(it){
 let h='<div class="card" id="'+it.id+'">';
 if(it.yt)h+='<a href="'+it.url+'" target="_blank"><img class="thumb" src="https://i.ytimg.com/vi/'+it.yt+'/hqdefault.jpg" alt=""></a>';
 h+='<h2>'+esc(it.title)+'</h2><div class="meta">'+it.type+' · '+esc(it.by)+(it.length?' · '+it.length:'')+' · consumed '+it.consumed+' · <a href="'+it.url+'" target="_blank">open</a></div>';
 h+='<div class="tags">'+it.tags.map(t=>'<span>'+t+'</span>').join('')+'</div>';
 if(it.mine&&it.mine.length)h+='<h3>My takeaways</h3><div class="mine"><ul>'+it.mine.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
 h+='<h3>Key learnings</h3><ul>'+it.learnings.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
 if(it.quotes)h+='<h3>Quotes</h3>'+it.quotes.map(q=>'<blockquote>'+esc(q)+'</blockquote>').join('');
 if(it.chapters)h+='<h3>Chapters</h3><ul class="ch">'+it.chapters.map(c=>'<li><a target="_blank" href="'+it.url+'&t='+secs(c[0])+'s"><b>'+c[0]+'</b>'+esc(c[1])+'</a></li>').join('')+'</ul>';
 return h+'</div>';
}
function render(){
 const q=document.getElementById('q').value.toLowerCase();
 const xs=ITEMS.filter(it=>(!tag||it.tags.includes(tag))&&(!q||JSON.stringify(it).toLowerCase().includes(q))).sort((a,b)=>b.consumed.localeCompare(a.consumed));
 document.getElementById('list').innerHTML=xs.map(card).join('')||'<p>Nothing matches.</p>';
 document.getElementById('count').textContent=ITEMS.length+' item'+(ITEMS.length>1?'s':'');
 const all=[...new Set(ITEMS.flatMap(i=>i.tags))];
 document.getElementById('tagbar').innerHTML=['',...all].map(t=>'<span class="pill'+(t===tag?' on':'')+'" data-t="'+t+'">'+(t||'All')+'</span>').join(' ');
 document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{tag=p.dataset.t;render()});
}
document.getElementById('q').oninput=render;render();
</script></body></html>
