<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Watched & consumed - Ana</title>
<style>
:root{--ink:#1e1b4b;--muted:#64748b;--bg:#f8fafc;--card:#fff;--accent:#4f46e5;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:28px 18px 22px}header h1{margin:0 0 4px;font-size:26px}header p{margin:0;opacity:.9;font-size:14px}
main{max-width:820px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.bar input{flex:1;min-width:180px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}
.pill{border:1px solid #c7d2fe;background:var(--soft);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}.pill.on{background:var(--accent);color:#fff}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:20px}.meta{color:var(--muted);font-size:13px;margin-bottom:10px}.meta a{color:var(--accent)}
.tags span{display:inline-block;background:var(--soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:12px;margin:0 4px 4px 0}
h3{font-size:15px;margin:16px 0 6px;color:var(--accent)}ul{margin:0;padding-left:20px}li{margin:4px 0}
.mine{background:#fff7ed;border-left:4px solid #f97316;padding:10px 14px;border-radius:10px}
blockquote{margin:6px 0;padding:8px 12px;border-left:3px solid #a5b4fc;background:#f8fafc;border-radius:6px;font-style:italic}
.ch a{color:var(--ink);text-decoration:none}.ch a b{color:var(--accent);font-weight:600;margin-right:6px}
.thumb{width:100%;border-radius:12px;display:block;margin-bottom:12px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
</style></head><body>
<header><h1>Watched & consumed</h1><p>Videos, talks, articles and books I went through, with what I took from each.</p></header>
<main>
<div class="bar"><input id="q" placeholder="Search titles, learnings, tags"><span id="tagbar"></span></div>
<div id="list"></div>
</main>
<footer>Newest first. <span id="count"></span></footer>
<script>
const ITEMS=[
{"id": "all-about-pivoting", "type": "Video", "title": "All About Pivoting", "by": "Dalton Caldwell (Y Combinator, Startup School 2019)", "url": "https://www.youtube.com/watch?v=8pNxKX1SUGE", "yt": "8pNxKX1SUGE", "length": "27:54", "published": "2019-08-29", "consumed": "2026-11-15", "tags": ["pivot", "idea-evaluation", "product-market-fit", "founders", "startup-school"], "mine": ["Nobody regrets the journey of doing a startup. It is one of the hardest experiences of their life, but it is also huge growth.", "What people do regret is not starting the next thing earlier, not trying harder, and not going all the way (fully testing the idea before calling it)."], "learnings": ["<b>A pivot just means changing your idea.</b> Early on it should feel lightweight. If you are not rapidly changing ideas and assumptions over and over, you are probably moving too slow.", "<b>The main reason to pivot is opportunity cost.</b> His rule: if (how well it is working / months of full-time effort) is less than (excitement for something else + confidence you can find better), pivot. Months of effort with nothing happening is the strongest signal.", "<b>Good reasons to pivot:</b> you hate working on it, it is not growing, you are not the right fit, it depends on something outside your control (VR or crypto adoption), or you are out of ideas to make it work.", "<b>Bad reasons to pivot:</b> running away from hard work (pivoting right when it is time to sell), chronic idea-hopping, or chasing a hot new thing because someone raised money for it.", "<b>Most founders wait too long.</b> Loss aversion, a little bit of traction, politeness mistaken for traction, fear of admitting defeat, blaming customers or investors, and \"just keep believing\" inspiration all slow the decision.", "<b>The uncanny valley of product-market fit.</b> A total fail is an advantage over a little traction: you can drop it with no second-guessing. A flatline where you keep pushing a boulder uphill is the trap.", "<b>Anecdotes are lottery wins.</b> Play the statistics, take accountability, and remember it is your decision, not your YC partner's.", "<b>More shots on goal.</b> Several high-quality shots (fully built and launched) make you much more likely to get lucky than one.", "<b>Finding a better idea:</b> pick something that excites you more (often the perceived harder idea), be honest about what you are good and bad at, and choose something you can build and validate fast, not years of R&D.", "<b>Is it VC-fundable?</b> Hundreds of millions or billions in revenue, reachable in under 5-10 years, could be a public company, founders build the tech, 70-80% gross margins. Not every business needs VC.", "<b>Best time to pivot:</b> when weeks or months of trying feel hopeless, when the idea is impossible to start (\"once we raise $100M we will build a prototype\"), or when you know in your heart it will not work.", "<b>Avoid whiplash, and do not hire while pivoting.</b> Getting sad and giving up kills more companies than a bad idea. Only add people once you know the idea works.", "<b>Idea quality score (1-10 each, averaged):</b> how big it seems, founder/market fit, how easy it is to get started, and early market feedback. Examples: Brex (VR headset to corporate card), Retool (Venmo for the UK to internal tools builder), Magic (blood pressure coach to a weekend prototype that hit #1 on Hacker News), Segment (classroom feedback tool to analytics).", "<b>Speed:</b> for software, major progress in weeks, under 10 weeks per cycle. If you cannot say what you learned recently, you are not moving fast enough."], "quotes": ["It just means changing your idea. That's all it means.", "Watch out for politeness and getting that politeness confused with traction.", "It's much easier to be lucky when you get, like, half a dozen shots on goal than one.", "Weirdly, it's more deadly to your company to get whiplash and get sad than to work on a bad idea."], "chapters": [["0:00", "Introduction"], ["0:29", "What is a \"pivot\"?"], ["1:54", "Why pivot?"], ["3:09", "Good and bad reasons to pivot"], ["4:51", "People wait too long to pivot"], ["8:57", "Product/market fit"], ["10:09", "Finding a better idea"], ["14:27", "The best time to pivot"], ["16:41", "Scoring ideas"], ["18:41", "Real-world examples"], ["26:50", "Conclusion"]]}
];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const secs=t=>t.split(':').reduce((a,b)=>a*60+ +b,0);
let tag='';
function card(it){
 let h='<div class="card" id="'+it.id+'">';
 if(it.yt)h+='<a href="'+it.url+'" target="_blank"><img class="thumb" src="https://i.ytimg.com/vi/'+it.yt+'/hqdefault.jpg" alt=""></a>';
 h+='<h2>'+esc(it.title)+'</h2><div class="meta">'+it.type+' · '+esc(it.by)+(it.length?' · '+it.length:'')+' · consumed '+it.consumed+' · <a href="'+it.url+'" target="_blank">open</a></div>';
 h+='<div class="tags">'+it.tags.map(t=>'<span>'+t+'</span>').join('')+'</div>';
 if(it.mine&&it.mine.length)h+='<h3>My takeaways</h3><div class="mine"><ul>'+it.mine.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
 h+='<h3>Key learnings</h3><ul>'+it.learnings.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
 if(it.quotes)h+='<h3>Quotes</h3>'+it.quotes.map(q=>'<blockquote>'+esc(q)+'</blockquote>').join('');
 if(it.chapters)h+='<h3>Chapters</h3><ul class="ch">'+it.chapters.map(c=>'<li><a target="_blank" href="'+it.url+'&t='+secs(c[0])+'s"><b>'+c[0]+'</b>'+esc(c[1])+'</a></li>').join('')+'</ul>';
 return h+'</div>';
}
function render(){
 const q=document.getElementById('q').value.toLowerCase();
 const xs=ITEMS.filter(it=>(!tag||it.tags.includes(tag))&&(!q||JSON.stringify(it).toLowerCase().includes(q))).sort((a,b)=>b.consumed.localeCompare(a.consumed));
 document.getElementById('list').innerHTML=xs.map(card).join('')||'<p>Nothing matches.</p>';
 document.getElementById('count').textContent=ITEMS.length+' item'+(ITEMS.length>1?'s':'');
 const all=[...new Set(ITEMS.flatMap(i=>i.tags))];
 document.getElementById('tagbar').innerHTML=['',...all].map(t=>'<span class="pill'+(t===tag?' on':'')+'" data-t="'+t+'">'+(t||'All')+'</span>').join(' ');
 document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{tag=p.dataset.t;render()});
}
document.getElementById('q').oninput=render;render();
</script></body></html>
