<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Watched & consumed - Ana</title>
<style>
:root{--ink:#1e1b4b;--muted:#64748b;--bg:#f8fafc;--card:#fff;--accent:#4f46e5;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:28px 18px 22px}header h1{margin:0 0 4px;font-size:26px}header p{margin:0;opacity:.9;font-size:14px}header a{color:#fff}
main{max-width:820px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.bar input{flex:1 1 100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}
.pill{display:inline-block;border:1px solid #c7d2fe;background:var(--soft);color:var(--accent);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;margin:0 4px 6px 0}.pill.on{background:var(--accent);color:#fff}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:10px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
.row:active{background:var(--soft)}
.row img,.row .ic{width:96px;height:54px;border-radius:8px;object-fit:cover;flex:none}
.row .ic{display:flex;align-items:center;justify-content:center;background:var(--soft);font-size:26px}
.row .tx{flex:1;min-width:0}.row b{display:block;font-size:15px;line-height:1.3}.row small{color:var(--muted);font-size:12.5px}
.row .go{color:#a5b4fc;font-size:22px;flex:none}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:18px;margin-bottom:16px}
.back{display:inline-block;margin:2px 0 12px;color:var(--accent);text-decoration:none;font-weight:600}
.card h2{margin:0 0 4px;font-size:20px}.meta{color:var(--muted);font-size:13px;margin-bottom:10px}.meta a{color:var(--accent)}
.tags span{display:inline-block;background:var(--soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:12px;margin:0 4px 4px 0}
h3{font-size:15px;margin:16px 0 6px;color:var(--accent)}ul{margin:0;padding-left:20px}li{margin:4px 0}
.sum{background:var(--soft);padding:10px 14px;border-radius:10px;margin:0}
.mine{background:#fff7ed;border-left:4px solid #f97316;padding:10px 14px;border-radius:10px}
blockquote{margin:6px 0;padding:8px 12px;border-left:3px solid #a5b4fc;background:#f8fafc;border-radius:6px;font-style:italic}
.ch a{color:var(--ink);text-decoration:none}.ch a b{color:var(--accent);font-weight:600;margin-right:6px}
.thumb{width:100%;border-radius:12px;display:block;margin-bottom:12px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
</style></head><body>
<header><h1>Watched & consumed</h1><p>Videos, talks, articles and books we went through. Tap one to see the summary and takeaways.</p></header>
<main>
<div id="listview"><div class="bar"><input id="q" placeholder="Search titles, learnings, tags"><div id="tagbar"></div></div><div id="list"></div></div>
<div id="detail" hidden></div>
</main>
<footer>Newest first. <span id="count"></span></footer>
<script>
const ITEMS=[
{"id":"innovify-ai-startups-2026","type":"Article","title":"AI Startups to Watch Out for in 2026: Building the Next Wave of Intelligent Products","by":"Innovify Editorial (shared by Gohar)","url":"https://innovify.com/insights/ai-startups-to-watch-out-for-in-2025","length":"~4 min read","published":"","consumed":"2026-11-15","tags":["ai-landscape","idea-evaluation","vertical-ai","ai-infrastructure","copilots","shared-by-gohar"],"mine":["Was a nice overview over categories of AI startup options","1. AI Infrastructure and Model Operations Startups: these startups build the foundation that enables AI at scale","2. AI Copilot and Workflow Automation Startups: one of the fastest-growing segments","3. Vertical AI Startups (Industry-Specific): where some of the biggest breakthroughs are happening","4. Generative AI Product Startups: generative AI continues to evolve beyond content creation","5. AI Decision Intelligence Platforms: AI is increasingly used for decision augmentation, not just automation"],"learnings":["<b>Thesis:</b> in 2026 AI is a foundational layer, not a differentiator. Models are widely accessible and infra costs are stabilising, so what separates startups is execution maturity: turning models into usable systems, integrating AI into real workflows and delivering measurable outcomes.","<b>How to evaluate an AI startup:</b> problem-solution fit over model innovation, a clear data advantage or proprietary pipeline, the ability to run AI in production, and a focus on ROI.","<b>AI-first vs AI-enabled:</b> AI-first products could not exist without AI; AI-enabled ones add intelligence to existing workflows. The most disruptive growth is where AI is embedded in the core product architecture.","<b>1. AI infrastructure and model ops:</b> training and deployment platforms, MLOps/LLMOps, data pipelines and orchestration. The pain is versioning, monitoring and reliability; next comes automated optimization, self-healing systems and real-time tuning.","<b>2. AI copilots and workflow automation:</b> copilots for developers and PMs, automated business-ops assistants. Companies are moving from AI tools to AI workflows: less manual intervention, more speed and consistency.","<b>3. Vertical AI</b> (fintech, healthcare, proptech, supply chain): wins on domain understanding, tailored data models and faster adoption. Predictive risk modeling, intelligent automation, real-time decision systems.","<b>4. Generative AI products:</b> code, designs, documents, conversational systems. Shift from novelty to utility: enterprise workflows, consistency, governance and scale. Winners turn gen AI into repeatable business processes.","<b>5. Decision intelligence platforms:</b> decision augmentation, not just automation. Data analysis plus predictive modelling and scenario planning for roadmaps, operations and financial forecasting.","<b>Challenges:</b> scaling models in production, data quality and governance, infra costs, explainability and trust, regulatory complexity.","<b>Picking winners:</b> execution over vision, real deployments, painful and expensive problems, AI in the core architecture, measurable outcomes.","<b>Caveat:</b> written by Innovify, a product agency, so it is a map of categories rather than a list of named startups, and it ends with a pitch for their services."],"quotes":["Instead of listing random companies, it's more valuable to track where innovation is happening structurally.","The winning startups are those turning generative AI into repeatable business processes.","These startups bridge the gap between data and decision-making."],"notesBy":"Gohar","seq":4,"summary":"A map of the five kinds of AI startups to watch in 2026 (infrastructure, copilots and workflow automation, vertical AI, generative AI products, decision intelligence). Its thesis: AI is now a foundation layer, so execution and real workflows are what set startups apart."},
{"id":"all-about-pivoting","type":"Video","title":"All About Pivoting","by":"Dalton Caldwell (Y Combinator, Startup School 2019)","url":"https://www.youtube.com/watch?v=8pNxKX1SUGE","yt":"8pNxKX1SUGE","length":"27:54","published":"2019-08-29","consumed":"2026-11-15","tags":["pivot","idea-evaluation","product-market-fit","founders","startup-school"],"mine":[],"learnings":["<b>A pivot just means changing your idea.</b> Early on it should feel lightweight. If you are not rapidly changing ideas and assumptions over and over, you are probably moving too slow.","<b>The main reason to pivot is opportunity cost.</b> His rule: if (how well it is working / months of full-time effort) is less than (excitement for something else + confidence you can find better), pivot. Months of effort with nothing happening is the strongest signal.","<b>Good reasons to pivot:</b> you hate working on it, it is not growing, you are not the right fit, it depends on something outside your control (VR or crypto adoption), or you are out of ideas to make it work.","<b>Bad reasons to pivot:</b> running away from hard work (pivoting right when it is time to sell), chronic idea-hopping, or chasing a hot new thing because someone raised money for it.","<b>Most founders wait too long.</b> Loss aversion, a little bit of traction, politeness mistaken for traction, fear of admitting defeat, blaming customers or investors, and \"just keep believing\" inspiration all slow the decision.","<b>The uncanny valley of product-market fit.</b> A total fail is an advantage over a little traction: you can drop it with no second-guessing. A flatline where you keep pushing a boulder uphill is the trap.","<b>Anecdotes are lottery wins.</b> Play the statistics, take accountability, and remember it is your decision, not your YC partner's.","<b>More shots on goal.</b> Several high-quality shots (fully built and launched) make you much more likely to get lucky than one.","<b>Finding a better idea:</b> pick something that excites you more (often the perceived harder idea), be honest about what you are good and bad at, and choose something you can build and validate fast, not years of R&D.","<b>Is it VC-fundable?</b> Hundreds of millions or billions in revenue, reachable in under 5-10 years, could be a public company, founders build the tech, 70-80% gross margins. Not every business needs VC.","<b>Best time to pivot:</b> when weeks or months of trying feel hopeless, when the idea is impossible to start (\"once we raise $100M we will build a prototype\"), or when you know in your heart it will not work.","<b>Avoid whiplash, and do not hire while pivoting.</b> Getting sad and giving up kills more companies than a bad idea. Only add people once you know the idea works.","<b>Idea quality score (1-10 each, averaged):</b> how big it seems, founder/market fit, how easy it is to get started, and early market feedback. Examples: Brex (VR headset to corporate card), Retool (Venmo for the UK to internal tools builder), Magic (blood pressure coach to a weekend prototype that hit #1 on Hacker News), Segment (classroom feedback tool to analytics).","<b>Speed:</b> for software, major progress in weeks, under 10 weeks per cycle. If you cannot say what you learned recently, you are not moving fast enough."],"quotes":["It just means changing your idea. That's all it means.","Watch out for politeness and getting that politeness confused with traction.","It's much easier to be lucky when you get, like, half a dozen shots on goal than one.","Weirdly, it's more deadly to your company to get whiplash and get sad than to work on a bad idea."],"chapters":[["0:00","Introduction"],["0:29","What is a \"pivot\"?"],["1:54","Why pivot?"],["3:09","Good and bad reasons to pivot"],["4:51","People wait too long to pivot"],["8:57","Product/market fit"],["10:09","Finding a better idea"],["14:27","The best time to pivot"],["16:41","Scoring ideas"],["18:41","Real-world examples"],["26:50","Conclusion"]],"seq":3,"summary":"Dalton Caldwell on when and how to pivot: a pivot is just changing your idea, decide on opportunity cost, most founders wait too long, and score new ideas on size, founder fit, ease of starting and early feedback, then move fast."},
{"id":"pg-making-startups-powerful","type":"Article","title":"Making Startups Powerful","by":"Paul Graham","url":"https://paulgraham.com/powerful.html","length":"~14 min read","published":"2026-09","consumed":"2026-11-15","tags":["strategy","power","network effects","marketplace","agents","ideas"],"mine":[],"learnings":["<b>Ask what would make the company more powerful, not just richer.</b> \"More money\" yields incremental improvements; \"more powerful\" can make it orders of magnitude more valuable.","<b>Own the customer and make the money flow through you.</b> Move from component supplier to the one with the customer relationship. Tokens flowing through you count too, but watch whether the model companies could engulf you or your customers.","<b>Build an app store, or at least the standard.</b> Others building on you makes you more valuable. In a new field, the first standard proposed tends to win, no matter who proposed it.","<b>Find network effects where you would not expect them.</b> Let users share something (opt-in benchmarks, opt-in model training). Generalize the idea: if agents can pay for things, can they pay each other? Then you are a marketplace.","<b>Go full stack, or eat through the customer.</b> Use your tech to do x yourself instead of selling it to companies doing x, or do all their hardest work until the real customer is their customer.","<b>Look for tails that wag the dog.</b> PayPal started as a demo of security software. When users \"misuse\" your product, listen: it could be the real product.","<b>Help users make money.</b> They adopt fast and pay a lot, so revenue grows doubly fast. Most of YC's biggest winners do this.","<b>Play the long game and be generous.</b> 10-year tradeoffs are underpriced. Create more value than you capture: open source, extensibility, and APIs, especially now that agents are replacing human users.","<b>Sell to early-stage companies and to customers who decide fast.</b> Usage pricing grows at startup rates (Stripe, the Collison install). Fast deciders decide on quality; hospitals and school districts are mud. Ask \"at what point in their life\" instead of \"what size\" customer.","<b>Get the data early; upstream is almost always good.</b> Rippling started with onboarding, where employee data is born.","<b>Avoid mafia markets</b> (record labels, PBMs) or come in from the side and make them irrelevant instead of a frontal attack.","<b>Often the startup holds itself back.</b> Much advice is \"you don't need x, just y\". Complicated ideas often come from fear; just stand up straight.","<b>The one constraint: it must be better for the customer.</b> Run it backwards to generate ideas: what would the perfect world look like for the customer, and which part of it could you become?"],"quotes":["Asking how the company could make more money is a good heuristic too, but it tends to yield incremental improvements.","It's always good when money flows through you.","So err on the side of having APIs. Especially when you're a larval startup and have nothing to lose.","Upstream is almost always good, whether it's with money or user relationship or customer stage or data.","Just y is often, in effect, just stand up straight."],"seq":2,"summary":"Paul Graham argues startups should ask what would make them more powerful, not just richer: own the customer, make the money flow through you, and build the platform others build on."},
{"id":"postmortem-dead-startup","type":"Video","title":"Postmortem on a Dead Startup","by":"Dalton Caldwell & Michael Seibel (Dalton + Michael)","url":"https://www.youtube.com/watch?v=Vh_eVn92KTc","yt":"Vh_eVn92KTc","length":"17:09","published":"2026-11-09","consumed":"2026-11-15","tags":["founders","regret","pivot","co-founders","fundraising"],"mine":["Nobody regrets the journey of doing a startup. It is one of the hardest experiences of their life, but it is also huge growth.","What people do regret is not starting the next thing earlier, not trying harder, and not going all the way (fully testing the idea before calling it)."],"learnings":["<b>Your startup is a hypothesis.</b> Most hypotheses are wrong, and that is fine. The regret is never fully testing it, not that it turned out false.","<b>The cost of indecision.</b> The most common regret: putting off the hard decision (pivot, shut down, change direction) until the money is almost gone. Decide earlier.","<b>People and team issues.</b> Picking the wrong co-founder and leaving team problems unresolved are recurring regrets. Fix them when you see them.","<b>The myth of the Hail Mary.</b> Another fundraise or another launch usually will not save the company. Confront the hard truth instead of chasing a last-minute miracle.","<b>Protect your \"health bar\".</b> Energy is a resource. Burning out makes every later decision worse.","<b>Investor and moral pressure.</b> Guilt about investor money keeps struggling companies alive too long. Founders often misunderstand what they actually owe investors.","<b>Growth through failure.</b> They never hear \"I regret doing a startup\". People regret specific decisions, never the journey. You go from a normal human to a minor superhero, like after 2 years at the gym.","<b>A failed startup still pays off.</b> It makes you a stronger founder and a more valuable hire, and fundraising is often easier the second time.","<b>Apply it now.</b> Imagine you are shutting down one year from today. Write down what you would wish you had done differently, and make those changes today."],"quotes":["Your startup is a hypothesis, right? And for any good scientist, how often is their hypothesis correct? It's like not that often.","What I never hear is I regret doing a startup.","There's regret about specific decisions, but there's never regret about the journey."],"chapters":[["0:00","Introduction to postmortems"],["1:05","The cost of indecision"],["3:51","Lack of closure"],["5:08","People and team issues"],["7:17","The myth of Hail Marys"],["9:44","Investor and moral pressure"],["12:30","Growth through failure"],["15:36","Applying these lessons now"]],"seq":1,"summary":"Dalton and Michael on what founders of dead startups regret: putting off hard decisions, team problems, Hail Mary fundraises and investor guilt. Nobody regrets the journey itself, only specific decisions."}
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const secs=t=>t.split(':').reduce((a,b)=>a*60+ +b,0);
const ICON={Video:'\u25B6\uFE0F',Article:'\uD83D\uDCC4',Book:'\uD83D\uDCDA',Podcast:'\uD83C\uDFA7'};
const sorted=()=>ITEMS.slice().sort((a,b)=>b.consumed.localeCompare(a.consumed)||(b.seq||0)-(a.seq||0));
let tag='';
function row(it){
 const pic=it.yt?'<img src="https://i.ytimg.com/vi/'+it.yt+'/mqdefault.jpg" alt="">':'<div class="ic">'+(ICON[it.type]||'\u2B50')+'</div>';
 return '<a class="row" href="#'+it.id+'">'+pic+'<div class="tx"><b>'+esc(it.title)+'</b><small>'+esc(it.type)+' \u00B7 '+esc(it.by)+(it.length?' \u00B7 '+esc(it.length):'')+'</small></div><span class="go">\u203A</span></a>';
}
function card(it){
 let h='<a class="back" href="#">\u2190 All content</a><div class="card">';
 if(it.yt)h+='<a href="'+it.url+'" target="_blank"><img class="thumb" src="https://i.ytimg.com/vi/'+it.yt+'/hqdefault.jpg" alt=""></a>';
 h+='<h2>'+esc(it.title)+'</h2><div class="meta">'+esc(it.type)+' \u00B7 '+esc(it.by)+(it.length?' \u00B7 '+esc(it.length):'')+' \u00B7 consumed '+it.consumed+' \u00B7 <a href="'+it.url+'" target="_blank">open</a></div>';
 h+='<div class="tags">'+it.tags.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div>';
 if(it.summary)h+='<h3>Summary</h3><p class="sum">'+esc(it.summary)+'</p>';
 if(it.mine&&it.mine.length)h+='<h3>'+(it.notesBy?esc(it.notesBy)+"'s takeaways":'My takeaways')+'</h3><div class="mine"><ul>'+it.mine.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
 if(it.learnings&&it.learnings.length)h+='<h3>Key learnings</h3><ul>'+it.learnings.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
 if(it.quotes&&it.quotes.length)h+='<h3>Quotes</h3>'+it.quotes.map(q=>'<blockquote>'+esc(q)+'</blockquote>').join('');
 if(it.chapters&&it.chapters.length)h+='<h3>Chapters</h3><ul class="ch">'+it.chapters.map(c=>'<li><a target="_blank" href="'+it.url+'&t='+secs(c[0])+'s"><b>'+c[0]+'</b>'+esc(c[1])+'</a></li>').join('')+'</ul>';
 return h+'</div><a class="back" href="#">\u2190 All content</a>';
}
function renderList(){
 const q=document.getElementById('q').value.toLowerCase();
 const xs=sorted().filter(it=>(!tag||it.tags.includes(tag))&&(!q||JSON.stringify(it).toLowerCase().includes(q)));
 document.getElementById('list').innerHTML=xs.map(row).join('')||'<p>Nothing matches.</p>';
 const all=[...new Set(ITEMS.flatMap(i=>i.tags))];
 document.getElementById('tagbar').innerHTML=['',...all].map(t=>'<span class="pill'+(t===tag?' on':'')+'" data-t="'+esc(t)+'">'+(esc(t)||'All')+'</span>').join('');
 document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{tag=p.dataset.t;renderList()});
}
function route(){
 const it=ITEMS.find(i=>i.id===decodeURIComponent(location.hash.slice(1)));
 const lv=document.getElementById('listview'),dv=document.getElementById('detail');
 if(it){dv.innerHTML=card(it);dv.hidden=false;lv.hidden=true;window.scrollTo(0,0);}
 else{dv.hidden=true;lv.hidden=false;renderList();}
}
document.getElementById('count').textContent=ITEMS.length+' item'+(ITEMS.length>1?'s':'');
document.getElementById('q').oninput=renderList;
window.addEventListener('hashchange',route);route();
</script></body></html>
