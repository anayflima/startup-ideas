<style>

</style></head><body>
<header><h1>Watched & consumed</h1><p>Videos, talks, articles and books I went through, with what I took from each.</p></header>

</main>

<script>
const ITEMS=[
{"id": "yc-f26-s26-physical-world-trend", "type": "Batch trend", "title": "YC F26 and S26: a wave of companies building the physical world", "by": "My own observation going through the YC Fall 2026 and Summer 2026 batches", "url": "https://www.ycombinator.com/companies?batch=Fall%202026", "length": "", "published": "", "consumed": "2026-11-15", "tags": ["batch-trend", "yc-batches", "physical-world", "infrastructure", "energy-grid", "construction", "real-estate", "govtech", "my-notes"], "mine": ["F26 and S26 trend: there is a lot for infrastructure, real estate development and building the actual physical thing", "Things like government building buildings, electric grids, physical construction. There is quite a lot of it"], "learnings": ["<b>The numbers back it up:</b> companies labelled Industrials, Real Estate & Construction or Government were 12-17% of every YC batch from Winter 2025 to Spring 2026, then jumped to <b>28% in S26</b> (63 of 227) and <b>26% in F26</b> (62 of 234). By batch: W25 15%, Spring25 12%, S25 12%, F25 15%, W26 16%, Spring26 17%, S26 28%, F26 26%. Rough count from the public YC directory mirror (yc-oss) using industry labels, so check before quoting.", "<b>Grid and energy (F26):</b> <a href=\"https://ryhla.ai\" target=\"_blank\">Ryhla</a> (faster power grid connection for projects), <a href=\"https://micora.com\" target=\"_blank\">Micora</a> (micro-grids in a box, deployed in weeks), <a href=\"https://evardi.ai/\" target=\"_blank\">Evardi</a> (agents that engineer the grid edge), <a href=\"https://hillstar.ai\" target=\"_blank\">HillStar</a> (agents for utility buying decisions), <a href=\"https://www.talos-us.com/\" target=\"_blank\">Talos</a> (predictive maintenance for power infrastructure), <a href=\"https://www.viraj-aero.com/\" target=\"_blank\">Viraj Aero</a> (gas turbines for data centers), <a href=\"https://www.invertix.ai\" target=\"_blank\">Invertix</a> (agents that operate energy plants and datacenters), <a href=\"https://ailitrail.com/\" target=\"_blank\">Ailit</a> (electrifying freight rail with swappable batteries). S26: <a href=\"https://atomarine.co\" target=\"_blank\">Atomarine</a> (floating nuclear data centers), <a href=\"https://subvysion.com\" target=\"_blank\">SubVysion</a> (rovers mapping underground utilities).", "<b>Construction, real estate and housing:</b> F26 <a href=\"https://constor.ai\" target=\"_blank\">Constor</a> (AI OS for the construction industry), <a href=\"https://buildhabu.com\" target=\"_blank\">HABU</a> (Crosby for real estate development), <a href=\"https://telamont.com\" target=\"_blank\">Telamont</a> (catches errors in construction documents), <a href=\"https://heygradon.com/\" target=\"_blank\">Gradon</a> (Legora for architecture, engineering and construction firms), <a href=\"https://gettireswing.com\" target=\"_blank\">Tire Swing</a> (AI affordable housing platform), <a href=\"https://verno-ai.com\" target=\"_blank\">Verno</a> (AI engineering for chip fabs, refineries, power plants), <a href=\"https://obia.io/\" target=\"_blank\">Obia</a> (AI commercial real estate brokerage). S26 <a href=\"https://www.cosmicrobotics.com/\" target=\"_blank\">Cosmic Robotics</a> (autonomous construction), <a href=\"https://www.alloovium.com/en\" target=\"_blank\">Alloovium</a> (company brain for construction companies), <a href=\"https://flowmanual.com/\" target=\"_blank\">FlowManual</a> (AI for construction back office), <a href=\"https://vestris.ai/\" target=\"_blank\">Vestris</a> (real estate closings), <a href=\"https://realpact.ai\" target=\"_blank\">RealPact</a> (OS for real estate brokerages).", "<b>Data centers as a construction project:</b> F26 <a href=\"https://www.librabots.com/\" target=\"_blank\">Libra Robotics</a> (robot workforce for AI-era infrastructure), <a href=\"https://shepherdrobotics.ai/\" target=\"_blank\">Shepherd Robotics</a> (robots for skilled labor on AI infrastructure), <a href=\"https://ninesrobotics.ai/\" target=\"_blank\">Nines</a> (robot pit crew for data centers), <a href=\"https://appliedkinetics.ai\" target=\"_blank\">Applied Kinetics</a> (AI-native manufacturing for data center and energy projects). S26 <a href=\"https://pacific.space\" target=\"_blank\">Pacific</a> (robotic factories that mass produce data centers), <a href=\"https://marengox.com\" target=\"_blank\">Marengo</a> (AI-native engineering firm designing data centers), <a href=\"https://www.propriorobotics.com/\" target=\"_blank\">Proprio Robotics</a> (robots to assemble and maintain data centers), <a href=\"https://www.usetorus.com\" target=\"_blank\">Torus</a> (superintelligence for infrastructure).", "<b>Government and public infrastructure:</b> F26 <a href=\"https://capveon.ai\" target=\"_blank\">Capveon</a> (turning infrastructure demand into action), <a href=\"https://particularity.io\" target=\"_blank\">Particularity</a> (tech stack for government regulators), <a href=\"https://adalat.ai/\" target=\"_blank\">Adalat AI</a> (AI OS for courts), <a href=\"https://reconero.com\" target=\"_blank\">Reconero</a> (police workflows). S26 <a href=\"https://www.verdantapp.com/\" target=\"_blank\">Verdant</a> (agents to make local government efficient), <a href=\"https://www.impact-drones.com\" target=\"_blank\">IMPACT Drones</a> (air defense for civilian infrastructure).", "<b>Factories too:</b> F26 <a href=\"https://horizontal-tech.com\" target=\"_blank\">horizontal.</a> (agents running factory operations end to end), <a href=\"https://twentyfour26.com/\" target=\"_blank\">twentyfour26</a> (autonomous factories in America). S26 <a href=\"https://www.controlseat.com\" target=\"_blank\">Control Seat</a> (AI that runs factories), <a href=\"https://tensr.com/\" target=\"_blank\">Tensr</a> (robotic factories that build robots), <a href=\"https://provenmetal.com\" target=\"_blank\">ProvenMetal</a>, <a href=\"https://www.guildai.co\" target=\"_blank\">GUILD</a> (faster defense manufacturing).", "<b>The pattern (Blue's read):</b> the AI build-out needs power, grid connections and buildings, and those industries are slow and paperwork-heavy (permits, interconnection queues, construction documents, procurement). Most of these startups put agents on that back office or robots on the labor, not new models.", "<b>Question for us:</b> does any of this fit our own backgrounds for the pivot (ML at Itau and BTG, Brazil), or is it just a trend to watch?"]},
{"id": "murilo-cockpit-decisions", "type": "Video", "title": "Tirei a coleira dos agentes: agora eles só me chamam pra decidir", "by": "Murilo Narciso (Zaz OS), shared in YC Brazil | Upvotes", "url": "https://www.youtube.com/watch?v=xX0ye1Ko5RA", "yt": "xX0ye1Ko5RA", "length": "12:09", "published": "2026-11-02", "consumed": "2026-11-15", "status": "to-watch", "tags": ["to-watch", "ai-agents", "human-in-the-loop", "agent-orchestration", "dev-tools"], "mine": [], "learnings": ["<b>The overall idea:</b> stop piloting agents chat by chat. With 60-70 tasks open at once, going thread to thread to find where each one got stuck stopped scaling: work sat waiting for him and context got lost. So he took the leash off: agents run on their own and only call him when they need a decision.", "<b>Decisions inbox (the key feature):</b> when an agent needs him it opens a Decision with what happened, the options and the one it recommends. He picks one (or writes another), the answer goes back to the thread and the agent carries on alone. Human-in-the-loop as a queue of decisions, not a chat.", "<b>Works with any agent:</b> built locally in Cockpit, his own IDE / meta-harness, as a simple tool any agent can call from Claude Code, Codex or Cursor. No specific harness or bot needed.", "<b>Agents that call agents:</b> agents talk to each other and spin up builders; supervisor agents look after support and the learning of the system (still with his approval for now).", "<b>Calendar, daily report, routines and heartbeat:</b> routines wake agents up from time to time so work keeps moving without him prompting it, and he gets a report of the day.", "<b>Zaz OS agent:</b> 3 prompts became 4 prototype interfaces for Zaz, the agent that will run Zaz OS for its users; open survey to pick the best one at research.zazos.com/agent-home.", "<b>Why take a look:</b> a concrete pattern for one founder running a fleet of agents with the human only as the decision-maker. Relevant to the AI agent cloud and AI company factory ideas.", "<b>Note:</b> summary from his LinkedIn post, the video description, the chapters and the opening of the transcript. Not watched yet."], "quotes": ["Os agentes agora só me mandam as decisões que precisam de mim!", "Foi o caminho que eu achei pra deixar os agentes bem mais autônomos, sem perder o controle.", "E vocês, já estão deixando os agentes rodarem sozinhos ou ainda pilotando no chat?"], "chapters": [["0:00", "Intro: soltar a coleira dos agentes"], ["0:57", "Agentes que chamam agentes"], ["1:52", "Decisões"], ["4:34", "Calendário e relatório do dia"], ["5:05", "Rotinas e heartbeat"], ["7:33", "O agente do Zaz OS: 4 interfaces"], ["10:18", "Software pra você mesmo"]]},
{"id": "innovify-ai-startups-2026", "type": "Article", "title": "AI Startups to Watch Out for in 2026: Building the Next Wave of Intelligent Products", "by": "Innovify Editorial (shared by Gohar)", "url": "https://innovify.com/insights/ai-startups-to-watch-out-for-in-2025", "length": "~4 min read", "published": "", "consumed": "2026-11-15", "tags": ["ai-landscape", "idea-evaluation", "vertical-ai", "ai-infrastructure", "copilots", "shared-by-gohar"], "mine": ["Gohar: Was a nice overview over categories of AI startup options", "1. AI Infrastructure and Model Operations Startups: these startups build the foundation that enables AI at scale", "2. AI Copilot and Workflow Automation Startups: one of the fastest-growing segments", "3. Vertical AI Startups (Industry-Specific): where some of the biggest breakthroughs are happening", "4. Generative AI Product Startups: generative AI continues to evolve beyond content creation", "5. AI Decision Intelligence Platforms: AI is increasingly used for decision augmentation, not just automation"], "learnings": ["<b>Thesis:</b> in 2026 AI is a foundational layer, not a differentiator. Models are widely accessible and infra costs are stabilising, so what separates startups is execution maturity: turning models into usable systems, integrating AI into real workflows and delivering measurable outcomes.", "<b>How to evaluate an AI startup:</b> problem-solution fit over model innovation, a clear data advantage or proprietary pipeline, the ability to run AI in production, and a focus on ROI.", "<b>AI-first vs AI-enabled:</b> AI-first products could not exist without AI; AI-enabled ones add intelligence to existing workflows. The most disruptive growth is where AI is embedded in the core product architecture.", "<b>1. AI infrastructure and model ops:</b> training and deployment platforms, MLOps/LLMOps, data pipelines and orchestration. The pain is versioning, monitoring and reliability; next comes automated optimization, self-healing systems and real-time tuning.", "<b>2. AI copilots and workflow automation:</b> copilots for developers and PMs, automated business-ops assistants. Companies are moving from AI tools to AI workflows: less manual intervention, more speed and consistency.", "<b>3. Vertical AI</b> (fintech, healthcare, proptech, supply chain): wins on domain understanding, tailored data models and faster adoption. Predictive risk modeling, intelligent automation, real-time decision systems.", "<b>4. Generative AI products:</b> code, designs, documents, conversational systems. Shift from novelty to utility: enterprise workflows, consistency, governance and scale. Winners turn gen AI into repeatable business processes.", "<b>5. Decision intelligence platforms:</b> decision augmentation, not just automation. Data analysis plus predictive modelling and scenario planning for roadmaps, operations and financial forecasting.", "<b>Challenges:</b> scaling models in production, data quality and governance, infra costs, explainability and trust, regulatory complexity.", "<b>Picking winners:</b> execution over vision, real deployments, painful and expensive problems, AI in the core architecture, measurable outcomes.", "<b>Caveat:</b> written by Innovify, a product agency, so it is a map of categories rather than a list of named startups, and it ends with a pitch for their services."], "quotes": ["Instead of listing random companies, it's more valuable to track where innovation is happening structurally.", "The winning startups are those turning generative AI into repeatable business processes.", "These startups bridge the gap between data and decision-making."]},
{"id": "all-about-pivoting", "type": "Video", "title": "All About Pivoting", "by": "Dalton Caldwell (Y Combinator, Startup School 2019)", "url": "https://www.youtube.com/watch?v=8pNxKX1SUGE", "yt": "8pNxKX1SUGE", "length": "27:54", "published": "2019-08-29", "consumed": "2026-11-15", "tags": ["pivot", "idea-evaluation", "product-market-fit", "founders", "startup-school"], "mine": ["Nobody regrets the journey of doing a startup. It is one of the hardest experiences of their life, but it is also huge growth.", "What people do regret is not starting the next thing earlier, not trying harder, and not going all the way (fully testing the idea before calling it)."], "learnings": ["<b>A pivot just means changing your idea.</b> Early on it should feel lightweight. If you are not rapidly changing ideas and assumptions over and over, you are probably moving too slow.", "<b>The main reason to pivot is opportunity cost.</b> His rule: if (how well it is working / months of full-time effort) is less than (excitement for something else + confidence you can find better), pivot. Months of effort with nothing happening is the strongest signal.", "<b>Good reasons to pivot:</b> you hate working on it, it is not growing, you are not the right fit, it depends on something outside your control (VR or crypto adoption), or you are out of ideas to make it work.", "<b>Bad reasons to pivot:</b> running away from hard work (pivoting right when it is time to sell), chronic idea-hopping, or chasing a hot new thing because someone raised money for it.", "<b>Most founders wait too long.</b> Loss aversion, a little bit of traction, politeness mistaken for traction, fear of admitting defeat, blaming customers or investors, and \"just keep believing\" inspiration all slow the decision.", "<b>The uncanny valley of product-market fit.</b> A total fail is an advantage over a little traction: you can drop it with no second-guessing. A flatline where you keep pushing a boulder uphill is the trap.", "<b>Anecdotes are lottery wins.</b> Play the statistics, take accountability, and remember it is your decision, not your YC partner's.", "<b>More shots on goal.</b> Several high-quality shots (fully built and launched) make you much more likely to get lucky than one.", "<b>Finding a better idea:</b> pick something that excites you more (often the perceived harder idea), be honest about what you are good and bad at, and choose something you can build and validate fast, not years of R&D.", "<b>Is it VC-fundable?</b> Hundreds of millions or billions in revenue, reachable in under 5-10 years, could be a public company, founders build the tech, 70-80% gross margins. Not every business needs VC.", "<b>Best time to pivot:</b> when weeks or months of trying feel hopeless, when the idea is impossible to start (\"once we raise $100M we will build a prototype\"), or when you know in your heart it will not work.", "<b>Avoid whiplash, and do not hire while pivoting.</b> Getting sad and giving up kills more companies than a bad idea. Only add people once you know the idea works.", "<b>Idea quality score (1-10 each, averaged):</b> how big it seems, founder/market fit, how easy it is to get started, and early market feedback. Examples: Brex (VR headset to corporate card), Retool (Venmo for the UK to internal tools builder), Magic (blood pressure coach to a weekend prototype that hit #1 on Hacker News), Segment (classroom feedback tool to analytics).", "<b>Speed:</b> for software, major progress in weeks, under 10 weeks per cycle. If you cannot say what you learned recently, you are not moving fast enough."], "quotes": ["It just means changing your idea. That's all it means.", "Watch out for politeness and getting that politeness confused with traction.", "It's much easier to be lucky when you get, like, half a dozen shots on goal than one.", "Weirdly, it's more deadly to your company to get whiplash and get sad than to work on a bad idea."], "chapters": [["0:00", "Introduction"], ["0:29", "What is a \"pivot\"?"], ["1:54", "Why pivot?"], ["3:09", "Good and bad reasons to pivot"], ["4:51", "People wait too long to pivot"], ["8:57", "Product/market fit"], ["10:09", "Finding a better idea"], ["14:27", "The best time to pivot"], ["16:41", "Scoring ideas"], ["18:41", "Real-world examples"], ["26:50", "Conclusion"]]}
];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const secs=t=>t.split(':').reduce((a,b)=>a*60+ +b,0);
let tag='';
function card(it){
 let h='<details class="card tg" id="'+it.id+'"'+((location.hash.slice(1)===it.id||document.getElementById('q').value.trim())?' open':'')+'><summary><div class="sm">';
 h+='<h2>'+esc(it.title)+'</h2><div class="meta">'+it.type+' · '+esc(it.by)+(it.length?' · '+it.length:'')+(it.status==='to-watch'?' · <b style=color:#ea580c>TO WATCH</b> · saved '+it.consumed:' · consumed '+it.consumed)+' · <a href="'+it.url+'" target="_blank">open</a></div>';
 h+='</div></summary><div class="tb">';
 if(it.yt)h+='<a href="'+it.url+'" target="_blank"><img class="thumb" src="https://i.ytimg.com/vi/'+it.yt+'/hqdefault.jpg" alt=""></a>';
 h+='<div class="tags">'+it.tags.map(t=>'<span>'+t+'</span>').join('')+'</div>';
 if(it.mine&&it.mine.length)h+='<h3>My takeaways</h3><div class="mine"><ul>'+it.mine.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
 h+='<h3>Key learnings</h3><ul>'+it.learnings.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
 if(it.quotes)h+='<h3>Quotes</h3>'+it.quotes.map(q=>'<blockquote>'+esc(q)+'</blockquote>').join('');
 if(it.chapters)h+='<h3>Chapters</h3><ul class="ch">'+it.chapters.map(c=>'<li><a target="_blank" href="'+it.url+'&t='+secs(c[0])+'s"><b>'+c[0]+'</b>'+esc(c[1])+'</a></li>').join('')+'</ul>';
 return h+'</div></details>';
}
function render(){
 const q=document.getElementById('q').value.toLowerCase();
 const xs=ITEMS.filter(it=>(!tag||it.tags.includes(tag))&&(!q||JSON.stringify(it).toLowerCase().includes(q))).sort((a,b)=>b.consumed.localeCompare(a.consumed));
 document.getElementById('list').innerHTML=xs.map(card).join('')||'<p>Nothing matches.</p>';
 document.getElementById('count').textContent=ITEMS.length+' item'+(ITEMS.length>1?'s':'');
 const all=[...new Set(ITEMS.flatMap(i=>i.tags))];
 document.getElementById('tagbar').innerHTML=['',...all].map(t=>'<span class="pill'+(t===tag?' on':'')+'" data-t="'+t+'">'+(t||'All')+'</span>').join(' ');
 document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{tag=p.dataset.t;render()});
}
document.getElementById('q').oninput=render;render();
</script></body></html>
