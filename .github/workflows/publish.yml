name: Publish bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: Link to a .tgz with index.html
        required: true
      message:
        description: Commit message (what changed)
        required: false
        default: ""
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundle
        if: github.event_name == 'workflow_dispatch'
        env:
          SRC: ${{ inputs.url }}
          MSG: ${{ inputs.message }}
        run: |
          curl -fsSL "$SRC" -o /tmp/b.tgz
          tar xzf /tmp/b.tgz -C .
          if [ -z "$MSG" ] && [ -f COMMIT_MSG ]; then MSG="$(cat COMMIT_MSG)"; fi
          rm -f COMMIT_MSG
          [ -n "$MSG" ] || MSG="Update site (no description given)"
          git config user.name blue-bot
          git config user.email blue-bot@users.noreply.github.com
          git add -A
          git commit -m "$MSG" || echo nochange
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - run: sleep 5
      - id: d
        uses: actions/deploy-pages@v4
