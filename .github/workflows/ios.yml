name: iOS app (TestFlight)
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight (needs the App Store Connect secrets)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build (and upload if asked)
        env:
          UPLOAD: ${{ inputs.upload }}
          BUILD: ${{ github.run_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ios-app/ci.sh
